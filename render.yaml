services:
  - type: web
    name: petcare-companion
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
