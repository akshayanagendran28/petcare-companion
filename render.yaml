databases:
  - name: petcare-db
    databaseName: petcare_db
    user: petcare_user
    plan: free

services:
  - type: web
    name: petcare-backend
    env: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "bash ./start.sh"
    healthCheckPath: /api/health-check/
    envVars:
      - key: DEBUG
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: petcare-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        value: "mongodb://akshayanagendran2005_db_user:oxMWH1iGaDTGc1nu@ac-7vgw2rk-shard-00-00.cgw10vq.mongodb.net:27017,ac-7vgw2rk-shard-00-01.cgw10vq.mongodb.net:27017,ac-7vgw2rk-shard-00-02.cgw10vq.mongodb.net:27017/petcare_companion_db?ssl=true&replicaSet=atlas-syqx38-shard-0&authSource=admin"
