{% extends 'base.html' %}

{% block title %}Delete Pet – {{ pet.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="glass-card p-4 text-center">
        <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
        <h4 class="fw-bold mb-2">Delete Pet Profile?</h4>
        <p class="text-muted small mb-4">Are you sure you want to remove <strong>{{ pet.name }}</strong>? All associated health records and ID cards will be removed.</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'pets:pet_detail' pet.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
